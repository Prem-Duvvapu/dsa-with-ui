# Render (and most PaaS free tiers) inject PORT and require the app to bind to it;
# BACKEND_PORT lets local runs override the default independently of that.
server.port=${PORT:${BACKEND_PORT:8923}}
spring.application.name=dsa-backend
management.endpoints.web.exposure.include=health,info,metrics

# The catalogue is ~236 KB of JSON and every page load fetches all of it. Compression takes
# that to roughly a fifth on the wire. 1024 is Spring's own floor - below it the CPU and the
# header overhead cost more than the saving.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,text/html,application/javascript
server.compression.min-response-size=1024

# Shallow ETags let a repeat visitor revalidate the catalogue with a 304 instead of pulling
# it again. Shallow rather than deep because the response is still generated either way -
# this saves bandwidth, not work. The cached projection in ProblemsController saves the work.
server.servlet.encoding.charset=UTF-8

# How many traces one client may run per minute. /execute runs real algorithms on
# caller-supplied input, and InputValidator bounds a single request but not many of them.
# 60 is a burst a person exploring a problem will never notice and a loop will hit at once.
dsa.rate-limit.executes-per-minute=60

# Observability. /execute is the only endpoint that runs real algorithms, so its timings are
# the only ones that can tell you the service is in trouble. DEBUG on the runner reports
# every trace; WARN alone reports the slow ones, the truncated ones, and rate-limit refusals.
logging.level.com.dsa.ui.tracer.TraceRunner=INFO
logging.level.com.dsa.ui.config.ExecuteRateLimitFilter=INFO
